[package]
name = "socket-activation-echo"
version = "0.1.0"
edition = "2021"
description = "A systemd socket-activated TCP echo daemon with fallback binding"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["socket", "net"] }

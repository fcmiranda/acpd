# /etc/logwatchd/config.toml — reference configuration for logwatchd
#
# logwatchd monitors directories for new log files and sends desktop
# notifications when error patterns are detected.

# Directory to watch for log files.
# The daemon will recursively watch this directory and all subdirectories.
watch_dir = "/var/log"

# Glob patterns to filter which files are considered log files.
# Only files matching at least one pattern will be scanned.
file_patterns = ["*.log", "*.err", "syslog", "messages"]

# Regular expressions to match error patterns in log lines.
# Lines matching any of these patterns will trigger a desktop notification.
# Patterns are case-insensitive by default.
error_patterns = [
    "(?i)\\bERROR\\b",
    "(?i)\\bFATAL\\b",
    "(?i)\\bCRITICAL\\b",
    "(?i)\\bPANIC\\b",
    "(?i)segfault",
    "(?i)out of memory",
]

# How often (in seconds) to scan newly detected files for error patterns.
# Lower values mean faster detection but higher CPU usage.
scan_interval_secs = 5

# Maximum number of notifications to send per minute to avoid flooding.
# Set to 0 for unlimited (not recommended in production).
rate_limit_per_minute = 10

# Desktop notification settings
[notification]
# Application name shown in the notification
app_name = "logwatchd"
# Notification urgency: "low", "normal", or "critical"
urgency = "critical"
# How long (in seconds) the notification stays visible. 0 = default.
timeout_secs = 10

# Daemon runtime settings
[daemon]
# PID file path. Set to empty string to disable.
pid_file = "/run/logwatchd/logwatchd.pid"
# Graceful shutdown timeout in seconds.
shutdown_timeout_secs = 30
# Log level: trace, debug, info, warn, error
log_level = "info"

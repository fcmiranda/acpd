[package]
name = "logwatchd"
version = "0.1.0"
edition = "2021"
description = "A daemon that monitors directories for new log files and sends desktop notifications when error patterns are found"
license = "MIT"
authors = ["logwatchd contributors"]

[[bin]]
name = "logwatchd"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-journald = "0.3"

# Serialization & config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Filesystem watching
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }

# Unix signal handling
nix = { version = "0.29", features = ["signal", "fs"] }

# systemd integration
sd-notify = "0.4"

# Error handling
anyhow = "1"

# Pattern matching for error detection
regex = "1"

# Desktop notifications (via D-Bus / libnotify)
zbus = { version = "4", default-features = false, features = ["tokio"] }

# Lock-free shared config for hot-reload
arc-swap = "1"

# Glob pattern matching for log file filtering
glob = "0.3"

[profile.release]
lto = true
strip = true
codegen-units = 1

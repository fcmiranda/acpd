# logwatchd configuration file
# Default location: /etc/logwatchd/config.toml

[general]
# Directory to monitor for new log files
watch_dir = "/var/log"

# How often to poll for changes (in seconds), used as a fallback
poll_interval_secs = 5

# PID file location
pid_file = "/run/logwatchd.pid"

# Log level: trace, debug, info, warn, error
log_level = "info"

# Log output format: "pretty" or "json"
log_format = "pretty"

[patterns]
# Regex patterns that trigger notifications when matched in log files
# Each pattern has a name and a regex string
[[patterns.entries]]
name = "error"
regex = "(?i)\\b(error|err)\\b"
severity = "critical"

[[patterns.entries]]
name = "warning"
regex = "(?i)\\b(warning|warn)\\b"
severity = "normal"

[[patterns.entries]]
name = "panic"
regex = "(?i)\\b(panic|fatal|segfault)\\b"
severity = "critical"

[notifications]
# Enable or disable desktop notifications
enabled = true

# Notification timeout in milliseconds (0 = no timeout)
timeout_ms = 10000

# Application name shown in notifications
app_name = "logwatchd"

# Maximum notifications per minute (rate limiting)
max_per_minute = 30

[file_filter]
# Only watch files matching these glob patterns
include = ["*.log", "*.txt"]

# Ignore files matching these glob patterns
exclude = ["*.gz", "*.bz2", "*.xz", "*.zip"]

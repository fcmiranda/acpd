[package]
name = "logwatchd"
version = "0.1.0"
edition = "2021"
description = "A daemon that monitors directories for new log files and sends desktop notifications on error patterns"
license = "MIT"

[[bin]]
name = "logwatchd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "6"
notify-rust = "4"
regex = "1"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
futures = "0.3"

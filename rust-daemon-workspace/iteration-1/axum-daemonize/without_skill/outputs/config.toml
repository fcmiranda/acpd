# api-gateway configuration
# Copy this file to /etc/api-gateway/config.toml and adjust as needed.

[server]
# Address to listen on.
host = "0.0.0.0"

# TCP port for the HTTP server.
port = 3000

# Maximum number of seconds to wait for in-flight HTTP requests to complete
# during graceful shutdown. Must be less than TimeoutStopSec in the systemd
# unit file.
shutdown_timeout_secs = 30

[daemon]
# Path to the PID file. The parent directory is created automatically.
# When running under systemd, RuntimeDirectory=api-gateway creates /run/api-gateway.
pid_file = "/run/api-gateway/api-gateway.pid"

# Whether to send watchdog keepalive pings to systemd.
# The interval is auto-detected from the WATCHDOG_USEC environment variable
# set by systemd's WatchdogSec directive.
watchdog_enabled = true

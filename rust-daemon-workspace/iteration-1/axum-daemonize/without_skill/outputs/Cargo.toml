[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"
description = "A daemonized axum HTTP server with systemd integration"

[[bin]]
name = "api-gateway"
path = "src/main.rs"

[dependencies]
# Web framework
axum = "0.7"
hyper = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["timeout", "limit"] }
tower-http = { version = "0.5", features = ["trace", "timeout"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Systemd integration
sd-notify = "0.4"

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-journald = "0.3"

# Signal handling
nix = { version = "0.28", features = ["signal"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Misc
chrono = "0.4"

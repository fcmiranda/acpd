# default.toml — reference configuration for api-gateway
#
# Copy this file to /etc/api-gateway/config.toml and edit as needed.
# Environment variables (API_GATEWAY_PORT, API_GATEWAY_LISTEN_ADDR,
# API_GATEWAY_LOG_LEVEL) override values set here.

# Address to bind the HTTP server to.
listen_addr = "127.0.0.1"

# Port to listen on. The original server uses 3000.
port = 3000

# Path to the PID file. The runtime directory is created by systemd's
# RuntimeDirectory= directive.
pid_file = "/run/api-gateway/api-gateway.pid"

# Seconds to wait for in-flight HTTP requests to drain during graceful
# shutdown before forcing exit.
shutdown_timeout_secs = 30

# Minimum log level: trace, debug, info, warn, error.
# Can also be controlled via the RUST_LOG environment variable.
log_level = "info"

# Interval (in seconds) between systemd watchdog pings.
# Must be less than WatchdogSec / 2 in the systemd unit file.
watchdog_interval_secs = 10
